<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Esqueci minha senha — revelação</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/auth-styles.css">
</head>
<body>
<div>
  <div class="wordmark">revela<span class="dot">·</span>ção</div>
  <div class="card">
    <h1>Esqueci minha senha</h1>
    <p class="sub">Enviamos um link de redefinição pro seu e-mail, se ele tiver uma conta.</p>
    <form id="forgot-form">
      <label for="email">E-mail</label>
      <input id="email" name="email" type="email" required autocomplete="email">
      <button class="primary" type="submit">Enviar link</button>
      <div class="msg" id="forgot-msg"></div>
    </form>
    <div class="links">
      <a href="/login.html">Voltar pro login</a>
      <span></span>
    </div>
  </div>
</div>
<script src="/auth.js"></script>
<script>
  wireForm("forgot-form", "forgot-msg", function (fd) {
    return postJSON("/api/auth/request-password-reset", { email: fd.get("email") })
      .then(function () {
        showMsg(document.getElementById("forgot-msg"), "Se esse e-mail tiver conta, o link chega em instantes.", "ok");
      });
  });
</script>
</body>
</html>
