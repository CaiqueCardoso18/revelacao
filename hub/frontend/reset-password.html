<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Redefinir senha — revelação</title>
<link rel="stylesheet" href="/auth-styles.css">
</head>
<body>
<div>
  <div class="wordmark">revela<span class="dot">·</span>ção</div>
  <div class="card">
    <h1>Redefinir senha</h1>
    <p class="sub">Escolha uma nova senha.</p>
    <form id="reset-form">
      <label for="password">Nova senha</label>
      <input id="password" name="password" type="password" required minlength="8" autocomplete="new-password">
      <button class="primary" type="submit">Redefinir</button>
      <div class="msg" id="reset-msg"></div>
    </form>
  </div>
</div>
<script src="/auth.js"></script>
<script>
  var token = new URLSearchParams(window.location.search).get("token");
  if (!token) {
    showMsg(document.getElementById("reset-msg"), "Link inválido — falta o token.", "error");
  }
  wireForm("reset-form", "reset-msg", function (fd) {
    return postJSON("/api/auth/reset-password", { token: token, new_password: fd.get("password") })
      .then(function () {
        showMsg(document.getElementById("reset-msg"), "Senha redefinida. Você já pode entrar.", "ok");
        setTimeout(function () { window.location.href = "/login.html"; }, 1500);
      });
  });
</script>
</body>
</html>
