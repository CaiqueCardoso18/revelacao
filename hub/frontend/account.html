<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minha conta — revelação</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div>
  <div class="wordmark">revela<span class="dot">·</span>ção</div>
  <div class="card">
    <h1>Você está logado</h1>
    <p class="sub" id="email-line">carregando…</p>
    <div class="account-row">
      <span style="font-size:12px;color:var(--text-faint);">
        A tela de eventos ainda não foi ligada aqui — próxima fase.
      </span>
    </div>
    <button class="btn" id="logout-btn" style="margin-top:18px;width:100%;">Sair</button>
  </div>
</div>
<script src="/auth.js"></script>
<script>
  fetch("/api/auth/me", { credentials: "same-origin" }).then(function (res) {
    if (!res.ok) { window.location.href = "/login.html"; return; }
    return res.json();
  }).then(function (data) {
    if (data) document.getElementById("email-line").textContent = data.email;
  });

  document.getElementById("logout-btn").addEventListener("click", function () {
    postJSON("/api/auth/logout", {}).then(function () { window.location.href = "/login.html"; });
  });
</script>
</body>
</html>
