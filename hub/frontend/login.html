<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar — revelação</title>
<link rel="stylesheet" href="/auth-styles.css">
</head>
<body>
<div>
  <div class="wordmark">revela<span class="dot">·</span>ção</div>
  <div class="card">
    <h1>Entrar</h1>
    <p class="sub">Acesse sua conta pra ver seus eventos.</p>
    <form id="login-form">
      <label for="email">E-mail</label>
      <input id="email" name="email" type="email" required autocomplete="email">
      <label for="password">Senha</label>
      <input id="password" name="password" type="password" required autocomplete="current-password">
      <button class="primary" type="submit">Entrar</button>
      <div class="msg" id="login-msg"></div>
    </form>
    <div class="links">
      <a href="/forgot-password.html">Esqueci minha senha</a>
      <a href="/signup.html">Criar conta</a>
    </div>
  </div>
</div>
<script src="/auth.js"></script>
<script>
  wireForm("login-form", "login-msg", function (fd) {
    return postJSON("/api/auth/login", { email: fd.get("email"), password: fd.get("password") })
      .then(function () { window.location.href = "/"; });
  });
</script>
</body>
</html>
